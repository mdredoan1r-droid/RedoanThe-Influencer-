<!-- Selected Work / Portfolio Section -->
<section id="portfolio">
  <div class="container">
    <div class="section-title">
      <div>Selected Work</div>
      <h2>Portfolio Showcase</h2>
    </div>

    <!-- Portfolio Grid Container -->
    <div id="portfolio-grid" class="portfolio-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px;">
      <!-- Dynamic Videos will load here -->
    </div>
  </div>
</section>

<script>
  async function loadPortfolioProjects() {
    const projectFiles = [
      'content/projects/reels-robert.md',
      'content/projects/motion-graphics.md',
      'content/projects/low-budget-reel.md'
    ];

    const grid = document.getElementById('portfolio-grid');
    if (!grid) return;
    grid.innerHTML = '';

    for (let file of projectFiles) {
      try {
        const response = await fetch(file);
        if (!response.ok) continue;
        const text = await response.text();

        // Frontmatter Parsing
        const getMeta = (regex) => {
          const match = text.match(regex);
          return match ? (match[1] || match[2]).trim().replace(/^['"]|['"]$/g, '') : '';
        };

        const title = getMeta(/title:\s*"(.*?)"|title:\s*(.*)/) || 'Video Project';
        const category = getMeta(/category:\s*"(.*?)"|category:\s*(.*)/) || 'Shorts & Reels';
        const url = getMeta(/video_url:\s*"(.*?)"|video_url:\s*(.*)/);
        const client = getMeta(/client:\s*"(.*?)"|client:\s*(.*)/);

        let embedUrl = url;
        if (url.includes('youtube.com/shorts/')) {
          const videoId = url.split('shorts/')[1].split('?')[0];
          embedUrl = `https://www.youtube.com/embed/${videoId}`;
        } else if (url.includes('youtu.be/')) {
          const videoId = url.split('youtu.be/')[1].split('?')[0];
          embedUrl = `https://www.youtube.com/embed/${videoId}`;
        }

        const card = `
          <div class="portfolio-card" style="background: #181818; border-radius: 12px; overflow: hidden; padding: 15px; border: 1px solid #222;">
            <div style="background: #ff0055; color: #fff; display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px;">${category}</div>
            <div style="position: relative; padding-bottom: 177.77%; height: 0; overflow: hidden; border-radius: 8px;">
              <iframe src="${embedUrl}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen></iframe>
            </div>
            <h3 style="color: #fff; font-size: 16px; margin: 12px 0 5px 0;">${title}</h3>
            ${client ? `<p style="color: #888; font-size: 13px; margin: 0;">Client: ${client}</p>` : ''}
          </div>
        `;
        grid.innerHTML += card;
      } catch (err) {
        console.error("Error loading project file:", err);
      }
    }
  }

  document.addEventListener("DOMContentLoaded", loadPortfolioProjects);
</script>
