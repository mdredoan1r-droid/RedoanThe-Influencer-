backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Projects & Portfolio"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Project Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Shorts & Reels", "YouTube Editing", "Gaming Montages", "Motion Graphics", "Color Grading"], default: "Shorts & Reels"}
      - {label: "Video URL / Shorts Link", name: "video_url", widget: "string"}
      - {label: "Client Name (Optional)", name: "client", widget: "string", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", default: true}
